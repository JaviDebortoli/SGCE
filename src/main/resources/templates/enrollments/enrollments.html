<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" class="light">
<div th:replace="~{fragments/head :: head}"></div>

<body class="bg-background-light dark:bg-background-dark text-[#111418] dark:text-white">
<div class="flex min-h-screen">
    <!-- Sidebar Navigation -->
    <aside class="w-64 flex-shrink-0 border-r border-[#dbe0e6] dark:border-slate-700 bg-white dark:bg-background-dark flex flex-col justify-between">
        <div class="flex flex-col gap-6 p-6">
            <div class="flex items-center gap-3">
                <div class="bg-primary rounded-lg p-2 text-white">
                    <span class="material-symbols-outlined">school</span>
                </div>
                <div>
                    <h1 class="text-[#111418] dark:text-white text-lg font-bold leading-tight">SGCE Admin</h1>
                    <p class="text-[#617289] dark:text-slate-400 text-xs">Management System</p>
                </div>
            </div>
            <nav class="flex flex-col gap-2">
                <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#617289] dark:text-slate-300 hover:bg-background-light dark:hover:bg-slate-800 transition-colors"
                   th:href="@{/}">
                    <span class="material-symbols-outlined">dashboard</span>
                    <span class="text-sm">Dashboard</span>
                </a>
                <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#617289] dark:text-slate-300 hover:bg-background-light dark:hover:bg-slate-800 transition-colors"
                   th:href="@{/students}">
                    <span class="material-symbols-outlined">group</span>
                    <span class="text-sm">Students</span>
                </a>
                <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-[#617289] dark:text-slate-300 hover:bg-background-light dark:hover:bg-slate-800 transition-colors"
                   th:href="@{/courses}">
                    <span class="material-symbols-outlined">book_4</span>
                    <span class="text-sm">Courses</span>
                </a>
                <a class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-primary/10 text-primary font-medium"
                   href="#">
                    <span class="material-symbols-outlined">assignment_ind</span>
                    <span class="text-sm">Enrollments</span>
                </a>
            </nav>
        </div>
    </aside>
    <!-- Main Content -->
    <main class="flex-1 flex flex-col">
        <!-- Top Navbar -->
        <header class="h-16 flex items-center justify-between px-8 border-b border-[#dbe0e6] dark:border-slate-700 bg-white dark:bg-background-dark">
            <h2 class="text-xl font-bold">Enrollments Management</h2>
        </header>
        <!-- Scrollable Page Content -->
        <div class="flex-1 overflow-y-auto p-8 space-y-10">
            <!-- Registration Form -->
            <section class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm p-6">
                <h3 class="text-lg font-bold mb-6">Quick Registration</h3>
                <form th:action="@{/enrollments}" method="post"
                      class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                    <div>
                        <label class="text-xs font-bold text-slate-500 uppercase">
                            File Number
                        </label>
                        <input name="fileNumber"
                               type="text"
                               placeholder="FILE-2026-XXX"
                               class="w-full h-11 px-4 rounded-lg bg-slate-50 border"
                               required>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500 uppercase">
                            Student DNI
                        </label>
                        <input name="dni"
                               type="number"
                               placeholder="12345678"
                               class="w-full h-11 px-4 rounded-lg bg-slate-50 border"
                               required>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500 uppercase">
                            Course Code
                        </label>
                        <input name="code"
                               type="text"
                               placeholder="COURSE001"
                               class="w-full h-11 px-4 rounded-lg bg-slate-50 border"
                               required>
                    </div>
                    <button type="submit"
                            class="w-full h-11 rounded-lg bg-primary text-white font-semibold">
                        Register Course
                    </button>
                </form>
            </section>
            <!-- Enrollments Table -->
            <section class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
                <div class="p-6 border-b border-slate-200 dark:border-slate-800">
                    <h3 class="text-lg font-bold">Enrollments List</h3>
                </div>
                <!-- Table Wrapper -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-50 dark:bg-slate-800/50">
                        <tr>
                            <th class="px-6 py-4 text-xs font-bold text-[#617289] dark:text-slate-300 uppercase tracking-wider">
                                File Number
                            </th>
                            <th class="px-6 py-4 text-xs font-bold text-[#617289] dark:text-slate-300 uppercase tracking-wider">
                                Student
                            </th>
                            <th class="px-6 py-4 text-xs font-bold text-[#617289] dark:text-slate-300 uppercase tracking-wider">
                                Course
                            </th>
                            <th class="px-6 py-4 text-xs font-bold text-[#617289] dark:text-slate-300 uppercase tracking-wider">
                                Enrolled at
                            </th>
                            <th class="px-6 py-4 text-xs font-bold text-[#617289] dark:text-slate-300 uppercase tracking-wider">
                                Status
                            </th>
                            <th class="px-6 py-4 text-xs font-bold text-[#617289] dark:text-slate-300 uppercase tracking-wider text-right">
                                Delete
                            </th>
                        </tr>
                        </thead>
                        <!-- Table Body -->
                        <tbody class="divide-y divide-[#dbe0e6] dark:divide-slate-700">
                        <tr th:each="e : ${enrollments}"
                            class="hover:bg-slate-50 dark:hover:bg-slate-700/30 transition-colors">
                            <td th:text="${e.fileNumber}"
                                class="px-6 py-4 text-sm font-semibold text-[#111418] dark:text-white">
                            </td>
                            <td th:text="${e.studentName}"
                                class="px-6 py-4 text-sm text-[#617289] dark:text-slate-400">
                            </td>
                            <td th:text="${e.courseName}"
                                class="px-6 py-4 text-sm text-[#617289] dark:text-slate-400">
                            </td>
                            <td th:text="${(e.createdAt).toString().replace('T', ' ')}"
                                class="px-6 py-4 text-sm text-[#617289] dark:text-slate-400">
                            </td>
                            <td class="px-6 py-4 text-sm text-[#617289] dark:text-slate-400">
                                <form th:action="@{/enrollments/status}" method="post">
                                    <input type="hidden"
                                           name="idEnrollment"
                                           th:value="${e.idEnrollment}" />
                                    <select name="status"
                                            onchange="if(confirm('Change enrollment status?')){this.form.submit()} else {this.value=this.getAttribute('data-current')}"
                                            th:attr="data-current=${e.status}"
                                            th:class="'min-w-[130px] pr-8 inline-flex items-center px-3 py-1.5 rounded-full text-xs font-medium border transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary/20 appearance-none ' +
                                            (${e.status == 'ACTIVE'} ?
                                            'bg-green-100 text-green-800 border-green-200 dark:bg-green-900/30 dark:text-green-400' :
                                            (${e.status == 'FINISHED'} ?
                                            'bg-blue-100 text-blue-800 border-blue-200 dark:bg-blue-900/30 dark:text-blue-400' :
                                            'bg-red-100 text-red-800 border-red-200 dark:bg-red-900/30 dark:text-red-400'))">
                                        <option th:value="ACTIVE"
                                                th:selected="${e.status == 'ACTIVE'}">
                                            Active
                                        </option>
                                        <option th:value="FINISHED"
                                                th:selected="${e.status == 'FINISHED'}">
                                            Finished
                                        </option>
                                        <option th:value="CANCELLED"
                                                th:selected="${e.status == 'CANCELLED'}">
                                            Cancelled
                                        </option>
                                    </select>
                                </form>
                            </td>
                            <td class="px-6 py-4 text-right">
                                <form th:action="@{/enrollments/delete}" method="post">
                                    <input type="hidden" name="idEnrollment" th:value="${e.idEnrollment}" />
                                    <button type="submit"
                                            class="p-1.5 rounded hover:bg-red-50 text-red-500"
                                            onclick="return confirm('Are you sure you want to delete this enrollment?');">
                                        <span class="material-symbols-outlined">delete</span>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
</div>
</body>
</html>
